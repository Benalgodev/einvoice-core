[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "einvoice-core"
version = "0.1.0"
description = "Modèle EN 16931, calculs de totaux et de TVA, lecture UBL/CII"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bénédiction Mulemba" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/einvoice_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
